[build-system]
requires = ["setuptools>=77", "wheel", "numpy==2.2.6"]
build-backend = "setuptools.build_meta"

[project]
name = "trajplayer-gpu"
dynamic = ["version"]
description = "GPU-first desktop viewer for large molecular dynamics trajectories"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TrajPlayer contributors" }]
keywords = ["molecular-dynamics", "trajectory", "opengl", "gromacs", "ase"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "ase==3.27.0",
  "chemfiles==0.10.4",
  "numpy==2.2.6",
  "PySide6==6.10.2",
  "PySide6-Addons==6.10.2",
]

[project.optional-dependencies]
dev = [
  "PyInstaller==6.19.0",
  "pytest==8.4.1",
]

[project.scripts]
trajplayer = "app:main"

[project.urls]
Homepage = "https://github.com/luosj1212/TrajPlayer"
Documentation = "https://github.com/luosj1212/TrajPlayer#readme"
Issues = "https://github.com/luosj1212/TrajPlayer/issues"
Source = "https://github.com/luosj1212/TrajPlayer"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.dynamic]
version = { attr = "trajplayer.__version__" }

[tool.setuptools.packages.find]
include = ["trajplayer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
