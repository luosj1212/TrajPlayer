name: Bug report
description: Report a reproducible TrajPlayer failure or visual defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach confidential trajectories. Prefer a small synthetic reproducer.
  - type: input
    id: version
    attributes:
      label: TrajPlayer version
      placeholder: v0.1.0-alpha.6
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: NVIDIA RTX 4070 Laptop, driver 591.74
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Trajectory format and approximate size
      placeholder: XTC + GRO, 20 GB, 100,000 atoms
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest repeatable sequence of actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove private paths or molecular data before pasting logs.
    validations:
      required: true
