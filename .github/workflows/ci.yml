name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
          - os: ubuntu-22.04
            python: "3.11"
          - os: macos-15
            python: "3.11"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Linux OpenGL and Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from trajplayer.trajcore import NATIVE_FULL_AVAILABLE; assert NATIVE_FULL_AVAILABLE"
          python -m pytest -q

      - name: Exercise every trajectory reader
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/create_smoke_fixtures.py --output smoke-fixtures
          python app.py --reader-smoke=smoke-fixtures --reader-smoke-output=reader-smoke.json

      # GitHub's hosted Windows desktop session has no OpenGL 3.3 context.
      # Keep the Windows job responsible for imports/startup; Linux and macOS
      # exercise two rendered OpenGL frames below.
      - name: Exercise Windows application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python app.py --startup-smoke
          if ($LASTEXITCODE -ne 0) {
            Get-Content "traj_player_error.log" -ErrorAction SilentlyContinue
            throw "TrajPlayer source startup smoke test failed."
          }

      - name: Build and smoke-test Windows portable runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/build_release.py
          python scripts/report_bundle_size.py `
            --json-output bundle-size-Windows-x64.json `
            --baseline-file scripts/bundle_size_baselines.json `
            --platform Windows-x64 `
            --max-growth-percent 2
          $smokeCases = @(
            [pscustomobject]@{ Arguments = @("--startup-smoke") },
            [pscustomobject]@{ Arguments = @("--native-smoke") },
            [pscustomobject]@{ Arguments = @("--reader-smoke=smoke-fixtures", "--reader-smoke-output=portable-reader-smoke.json") }
          )
          foreach ($case in $smokeCases) {
            $arguments = $case.Arguments
            $process = Start-Process `
              -FilePath "dist/TrajPlayer/TrajPlayer.exe" `
              -ArgumentList $arguments `
              -WindowStyle Hidden `
              -PassThru
            if (-not $process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force
              throw "Portable runtime smoke test timed out: $arguments"
            }
            if ($process.ExitCode -ne 0) {
              Get-Content "dist/TrajPlayer/traj_player_error.log" -ErrorAction SilentlyContinue
              throw "Portable runtime smoke test failed: $arguments"
            }
          }

      - name: Upload Windows package forensics
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Windows-portable-smoke
          path: |
            TrajPlayer-Windows-x64-*.zip
            TrajPlayer-Windows-x64-*.zip.sha256
            bundle-size-Windows-x64.json
            portable-reader-smoke.json
          retention-days: 3

      - name: Exercise a real GUI and software OpenGL trajectory on Linux
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a python app.py --gui-smoke --gui-smoke-timeout-ms=20000 --gui-smoke-output=gui-smoke.json examples/c60.extxyz
          cat gui-smoke.json

      - name: Produce Linux performance telemetry
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a python app.py --benchmark-output=performance-Linux-x86_64.json --benchmark-atoms=10000 --benchmark-frames=16 --benchmark-render-frames=30 --benchmark-bonds --benchmark-finish-gpu
          python scripts/check_perf_report.py performance-Linux-x86_64.json

      - name: Upload performance telemetry
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: performance-Linux-x86_64
          path: performance-Linux-x86_64.json

      - name: Exercise a real GUI and OpenGL trajectory on macOS
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          python app.py --gui-smoke --gui-smoke-timeout-ms=20000 --gui-smoke-output=gui-smoke.json examples/c60.extxyz
          cat gui-smoke.json

      - name: Compile source
        run: python -m compileall -q app.py trajplayer scripts

      - name: Check release contents
        run: python scripts/check_release.py

      - name: Build wheel metadata
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
