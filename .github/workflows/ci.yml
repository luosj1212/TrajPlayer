name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
          - os: ubuntu-22.04
            python: "3.11"
          - os: macos-15
            python: "3.11"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Linux OpenGL and Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # GitHub's hosted Windows desktop session has no OpenGL 3.3 context.
      # Keep the Windows job responsible for imports/startup; Linux and macOS
      # exercise two rendered OpenGL frames below.
      - name: Exercise Windows application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python app.py --startup-smoke
          if ($LASTEXITCODE -ne 0) {
            Get-Content "traj_player_error.log" -ErrorAction SilentlyContinue
            throw "TrajPlayer source startup smoke test failed."
          }

      - name: Exercise a real GUI and software OpenGL trajectory on Linux
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a python app.py --gui-smoke --gui-smoke-timeout-ms=20000 --gui-smoke-output=gui-smoke.json examples/c60.extxyz
          cat gui-smoke.json

      - name: Exercise a real GUI and OpenGL trajectory on macOS
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          python app.py --gui-smoke --gui-smoke-timeout-ms=20000 --gui-smoke-output=gui-smoke.json examples/c60.extxyz
          cat gui-smoke.json

      - name: Compile source
        run: python -m compileall -q app.py trajplayer scripts

      - name: Check release contents
        run: python scripts/check_release.py

      - name: Build wheel metadata
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
