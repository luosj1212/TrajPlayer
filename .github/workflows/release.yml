name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            python: "3.10"
          - os: ubuntu-22.04
            label: Linux-x86_64
            python: "3.10"
          - os: macos-15
            label: macOS-arm64
            python: "3.11"
          - os: macos-15-intel
            label: macOS-x86_64
            python: "3.11"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Linux packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify tag version
        shell: bash
        run: |
          version="$(python -c 'from trajplayer import __display_version__; print(__display_version__)')"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Test release source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from trajplayer.trajcore import NATIVE_AVAILABLE; assert NATIVE_AVAILABLE"
          python -m pytest -q
          python scripts/check_release.py

      - name: Build portable archive
        run: python scripts/build_release.py

      - name: Create portable reader fixtures
        run: python scripts/create_smoke_fixtures.py --output smoke-fixtures

      - name: Report portable bundle size
        run: >-
          python scripts/report_bundle_size.py
          --json-output bundle-size-${{ matrix.label }}.json
          --baseline-file scripts/bundle_size_baselines.json
          --platform ${{ matrix.label }}
          --max-growth-percent 5

      - name: Smoke-test Windows portable runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist/TrajPlayer/TrajPlayer.exe" `
            -ArgumentList "--startup-smoke" `
            -WindowStyle Hidden `
            -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Portable TrajPlayer startup smoke test timed out."
          }
          if ($process.ExitCode -ne 0) {
            Get-Content "dist/TrajPlayer/traj_player_error.log" -ErrorAction SilentlyContinue
            throw "Portable TrajPlayer exited with code $($process.ExitCode)."
          }
          & "dist/TrajPlayer/TrajPlayer.exe" `
            --reader-smoke=smoke-fixtures `
            --reader-smoke-output=reader-smoke.json
          if ($LASTEXITCODE -ne 0) {
            Get-Content "dist/TrajPlayer/traj_player_error.log" -ErrorAction SilentlyContinue
            throw "Portable TrajPlayer reader smoke test failed."
          }
          Get-Content reader-smoke.json

      - name: Smoke-test Linux portable runtime
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          ./dist/TrajPlayer/TrajPlayer --reader-smoke=smoke-fixtures --reader-smoke-output=reader-smoke.json
          cat reader-smoke.json
          xvfb-run -a ./dist/TrajPlayer/TrajPlayer --gui-smoke --gui-smoke-timeout-ms=20000 --gui-smoke-output=gui-smoke.json examples/c60.extxyz
          cat gui-smoke.json

      - name: Smoke-test macOS app bundle
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          ./dist/TrajPlayer-macOS/TrajPlayer.app/Contents/MacOS/TrajPlayer --reader-smoke=smoke-fixtures --reader-smoke-output=reader-smoke.json
          cat reader-smoke.json
          ./dist/TrajPlayer-macOS/TrajPlayer.app/Contents/MacOS/TrajPlayer --gui-smoke --gui-smoke-timeout-ms=20000 --gui-smoke-output=gui-smoke.json examples/c60.extxyz
          cat gui-smoke.json
          codesign --verify --deep --strict dist/TrajPlayer-macOS/TrajPlayer.app

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: TrajPlayer-${{ matrix.label }}
          path: |
            TrajPlayer-*.zip
            TrajPlayer-*.zip.sha256
            TrajPlayer-*.tar.gz
            TrajPlayer-*.tar.gz.sha256
            bundle-size-*.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "TrajPlayer ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes_file"
