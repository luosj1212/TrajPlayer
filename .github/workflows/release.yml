name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            python: "3.10"
          - os: ubuntu-22.04
            label: Linux-x86_64
            python: "3.10"
          - os: macos-15
            label: macOS-arm64
            python: "3.11"
          - os: macos-15-intel
            label: macOS-x86_64
            python: "3.11"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Linux packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify tag version
        shell: bash
        run: |
          version="$(python -c 'from trajplayer import __display_version__; print(__display_version__)')"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Test release source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from trajplayer.trajcore import NATIVE_FULL_AVAILABLE; assert NATIVE_FULL_AVAILABLE"
          python -m pytest -q
          python scripts/check_release.py

      - name: Build portable archive
        run: python scripts/build_release.py

      - name: Create portable reader fixtures
        run: python scripts/create_smoke_fixtures.py --output smoke-fixtures

      - name: Report portable bundle size
        shell: bash
        env:
          PLATFORM_LABEL: ${{ matrix.label }}
        run: >-
          python scripts/report_bundle_size.py
          --json-output "bundle-size-${PLATFORM_LABEL}.json"
          --baseline-file scripts/bundle_size_baselines.json
          --platform "${PLATFORM_LABEL}"
          --max-growth-percent 2

      - name: Smoke-test Windows portable runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist/TrajPlayer/TrajPlayer.exe" `
            -ArgumentList "--startup-smoke" `
            -WindowStyle Hidden `
            -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Portable TrajPlayer startup smoke test timed out."
          }
          if ($process.ExitCode -ne 0) {
            Get-Content "dist/TrajPlayer/traj_player_error.log" -ErrorAction SilentlyContinue
            throw "Portable TrajPlayer exited with code $($process.ExitCode)."
          }
          $nativeProcess = Start-Process `
            -FilePath "dist/TrajPlayer/TrajPlayer.exe" `
            -ArgumentList "--native-smoke" `
            -WindowStyle Hidden `
            -PassThru
          if (-not $nativeProcess.WaitForExit(30000)) {
            Stop-Process -Id $nativeProcess.Id -Force
            throw "Portable TrajPlayer native extension smoke test timed out."
          }
          if ($nativeProcess.ExitCode -ne 0) {
            Get-Content "dist/TrajPlayer/traj_player_error.log" -ErrorAction SilentlyContinue
            throw "Portable TrajPlayer native extension smoke test failed."
          }
          $readerProcess = Start-Process `
            -FilePath "dist/TrajPlayer/TrajPlayer.exe" `
            -ArgumentList @(
              "--reader-smoke=smoke-fixtures",
              "--reader-smoke-output=reader-smoke.json"
            ) `
            -WindowStyle Hidden `
            -PassThru
          if (-not $readerProcess.WaitForExit(60000)) {
            Stop-Process -Id $readerProcess.Id -Force
            throw "Portable TrajPlayer reader smoke test timed out."
          }
          if ($readerProcess.ExitCode -ne 0) {
            Get-Content "dist/TrajPlayer/traj_player_error.log" -ErrorAction SilentlyContinue
            throw "Portable TrajPlayer reader smoke test failed."
          }
          Get-Content reader-smoke.json

      - name: Smoke-test Linux portable runtime
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          ./dist/TrajPlayer/TrajPlayer --native-smoke
          ./dist/TrajPlayer/TrajPlayer --reader-smoke=smoke-fixtures --reader-smoke-output=reader-smoke.json
          cat reader-smoke.json
          xvfb-run -a ./dist/TrajPlayer/TrajPlayer --gui-smoke --gui-smoke-timeout-ms=20000 --gui-smoke-output=gui-smoke.json examples/c60.extxyz
          cat gui-smoke.json

      - name: Benchmark Linux portable runtime
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PLATFORM_LABEL: ${{ matrix.label }}
        run: |
          xvfb-run -a ./dist/TrajPlayer/TrajPlayer --benchmark-output="performance-${PLATFORM_LABEL}.json" --benchmark-atoms=100000 --benchmark-frames=64 --benchmark-render-frames=120 --benchmark-bonds --benchmark-finish-gpu
          python scripts/check_perf_report.py "performance-${PLATFORM_LABEL}.json"
          xvfb-run -a ./dist/TrajPlayer/TrajPlayer --benchmark-output="performance-camera-${PLATFORM_LABEL}.json" --benchmark-atoms=100000 --benchmark-frames=64 --benchmark-bonds --benchmark-finish-gpu --benchmark-camera-spin-seconds=5
          python -c "import json, os; r=json.load(open(f\"performance-camera-{os.environ['PLATFORM_LABEL']}.json\")); assert r['render']['post_interaction_frame_ms_samples'] >= 1"

      - name: Smoke-test macOS app bundle
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          ./dist/TrajPlayer-macOS/TrajPlayer.app/Contents/MacOS/TrajPlayer --native-smoke
          ./dist/TrajPlayer-macOS/TrajPlayer.app/Contents/MacOS/TrajPlayer --reader-smoke=smoke-fixtures --reader-smoke-output=reader-smoke.json
          cat reader-smoke.json
          ./dist/TrajPlayer-macOS/TrajPlayer.app/Contents/MacOS/TrajPlayer --gui-smoke --gui-smoke-timeout-ms=20000 --gui-smoke-output=gui-smoke.json examples/c60.extxyz
          cat gui-smoke.json
          codesign --verify --deep --strict dist/TrajPlayer-macOS/TrajPlayer.app

      - name: Benchmark macOS app bundle
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
          PLATFORM_LABEL: ${{ matrix.label }}
        run: |
          ./dist/TrajPlayer-macOS/TrajPlayer.app/Contents/MacOS/TrajPlayer --benchmark-output="performance-${PLATFORM_LABEL}.json" --benchmark-atoms=100000 --benchmark-frames=64 --benchmark-render-frames=30 --benchmark-bonds --benchmark-finish-gpu
          python scripts/check_perf_report.py "performance-${PLATFORM_LABEL}.json"
          ./dist/TrajPlayer-macOS/TrajPlayer.app/Contents/MacOS/TrajPlayer --benchmark-output="performance-camera-${PLATFORM_LABEL}.json" --benchmark-atoms=100000 --benchmark-frames=64 --benchmark-bonds --benchmark-finish-gpu --benchmark-camera-spin-seconds=5
          python -c "import json, os; r=json.load(open(f\"performance-camera-{os.environ['PLATFORM_LABEL']}.json\")); assert r['render']['post_interaction_frame_ms_samples'] >= 1"

      - name: Upload package artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TrajPlayer-${{ matrix.label }}
          path: |
            TrajPlayer-*.zip
            TrajPlayer-*.zip.sha256
            TrajPlayer-*.tar.gz
            TrajPlayer-*.tar.gz.sha256
            bundle-size-*.json
            performance-*.json
          if-no-files-found: warn

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Attest portable archives
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release-assets/TrajPlayer-*.zip
            release-assets/TrajPlayer-*.tar.gz

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          gh release create "$GITHUB_REF_NAME" release-assets/TrajPlayer-* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "TrajPlayer ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes_file"
