name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: ubuntu-22.04
            label: Linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Linux packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify tag version
        shell: bash
        run: |
          version="$(python -c 'from trajplayer import __display_version__; print(__display_version__)')"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Test release source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q
          python scripts/check_release.py

      - name: Build portable archive
        run: python scripts/build_release.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrajPlayer-${{ matrix.label }}
          path: |
            TrajPlayer-*.zip
            TrajPlayer-*.zip.sha256
            TrajPlayer-*.tar.gz
            TrajPlayer-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "TrajPlayer ${GITHUB_REF_NAME#v}" \
            --notes-file docs/releases/v0.1.0-alpha.1.md
